<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Sent</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .success { background: #d4edda; padding: 15px; border-radius: 5px; color: #155724; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <h2>Password Reset Email Sent</h2>
    
    <div class="success">
        <p>We've emailed you instructions for setting a new password. You should receive them shortly.</p>
        <p>If you don't receive an email, please make sure you've entered the address you registered with, and check your spam folder.</p>
    </div>
    
    <p><a href="{% url 'login' %}">Return to login</a></p>
</body>
</html>
