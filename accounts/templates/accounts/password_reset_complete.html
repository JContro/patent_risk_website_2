<!DOCTYPE html>
<html>
<head>
    <title>Password Reset Complete</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .success { background: #d4edda; padding: 15px; border-radius: 5px; color: #155724; }
        a { color: #007bff; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h2>Password Reset Complete</h2>
    
    <div class="success">
        <p>Your password has been set. You can now log in with your new password.</p>
    </div>
    
    <p><a href="{% url 'login' %}" class="btn">Log In</a></p>
</body>
</html>
